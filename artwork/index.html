<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Artwork | Waifu Lab</title><link rel="stylesheet" href="../assets/css/style.css"><script type="module" src="../assets/js/detail.js"></script><style>.detail{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:32px;align-items:start}.detail img{width:100%;height:auto;display:block;border-radius:16px}.related{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr));gap:20px}.related img{width:100%;aspect-ratio:3/4;object-fit:contain}a{color:inherit}#info p{white-space:pre-wrap} .detail{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}#character[hidden],#more[hidden]{display:none!important}#character{padding:28px;border:1px solid #523568;border-radius:20px;background:#191124;margin-top:24px}#character p{white-space:pre-wrap;line-height:1.7}.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.facts div{padding:14px;background:#251832;border-radius:12px}.facts h3,.facts p{margin:4px 0}.shop{display:inline-block;padding:12px 20px;background:#e5b1ff;color:#190d25;border-radius:10px;font-weight:bold;text-decoration:none}.brand img{width:54px;height:54px;object-fit:contain;vertical-align:middle}#info p{line-height:1.65}@media(max-width:760px){.detail{grid-template-columns:minmax(0,1fr);gap:20px}#character{padding:18px}main section{padding-top:24px;padding-bottom:24px}#info h2{font-size:1.7rem}}</style></head><body><header><a class="brand" href="../">WAIFU LAB</a><a href="../#art">Back to Art Studio</a></header><main><section><p id="status" role="status">Loading artwork…</p><div class="detail"><div id="picture"></div><div id="info"></div></div></section><section id="character" hidden></section><section id="more" hidden><h2>More artwork of this character</h2><div class="related" id="related"></div></section></main></body></html>
