<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Waifu Lab Admin</title><link rel="stylesheet" href="../assets/css/style.css"><script type="module" src="../assets/js/admin.js"></script><style>form{display:grid;gap:12px;max-width:540px}input,textarea,button{font:inherit;padding:12px;border-radius:8px;border:1px solid #795394;background:#21172f;color:white}button{cursor:pointer}label{display:grid;gap:4px}article{margin:12px 0;padding:16px;border:1px solid #795394;border-radius:12px} [hidden]{display:none!important}</style></head><body><header><a class="brand" href="../">WAIFU LAB / ADMIN</a><button id="logout" hidden>Logout</button></header><main><p id="status" role="status" aria-live="polite">Connecting…</p><section id="login" hidden><h1>Admin login</h1><form id="signin"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form></section><div id="dashboard" hidden><section><h2>Artwork Manager</h2><form id="art"><label>Title<input name="title" required maxlength="200"></label><label>Description<textarea name="description"></textarea></label><label>Category<input name="category" value="Fan Art" required></label><label>Public artwork image<input name="image" type="file" accept="image/jpeg,image/png,image/webp" required></label><p>Uploaded images are public even if the artwork listing is unpublished.</p><button>Upload and publish</button></form><div id="list"></div></section><section><h2>Brand Settings</h2><form id="brand"><label>Logo<input name="logo" type="file" accept="image/jpeg,image/png,image/webp"></label><label>Banner<input name="banner" type="file" accept="image/jpeg,image/png,image/webp"></label><button>Save brand images</button></form></section></div></main></body></html>
