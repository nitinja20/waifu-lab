<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Waifu Lab Admin</title><link rel="stylesheet" href="../assets/css/style.css"><script type="module" src="../assets/js/admin.js?v=3"></script><style>form{display:grid;gap:12px;max-width:540px}input,textarea,button,select{font:inherit;padding:12px;border-radius:8px;border:1px solid #795394;background:#21172f;color:white}button{cursor:pointer}label{display:grid;gap:4px}article{margin:12px 0;padding:16px;border:1px solid #795394;border-radius:12px} [hidden]{display:none!important}</style></head><body><header><a class="brand" href="../">WAIFU LAB / ADMIN</a><button id="logout" hidden>Logout</button></header><main><p id="status" role="status" aria-live="polite">Connecting…</p><section id="login" hidden><h1>Admin login</h1><form id="signin"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form></section><div id="dashboard" hidden><section><h2>Character Manager</h2><form id="character"><label>Edit existing character<select name="id" id="character-edit"><option value="">New character</option></select></label><label>Name<input name="name" required></label><label>Series / Universe<input name="series"></label><label>Type<select name="character_type"><option>Fan Art</option><option>Original</option></select></label><label>Species<input name="species"></label><label>Biography<textarea name="biography"></textarea></label><label>Personality<textarea name="personality"></textarea></label><label>Abilities<textarea name="abilities"></textarea></label><label><span>Published profile</span><input name="published" type="checkbox" checked></label><button>Save character</button></form></section><section><h2>Artwork Manager</h2><form id="art"><input type="hidden" name="id"><p id="edit-mode">New artwork</p><label>Title<input name="title" required maxlength="200"></label><label>Description<textarea name="description"></textarea></label><label>Affiliate product name<input name="product"></label><label>Amazon affiliate URL<input name="affiliate" type="url"></label><label>Category<input name="category" value="Fan Art" required></label><label>Linked character<select name="character_id" id="art-character"><option value="">None</option></select></label><label>Public artwork image<input name="image" type="file" accept="image/jpeg,image/png,image/webp" required></label><p>Uploaded images are public even if the artwork listing is unpublished.</p><button id="art-save">Upload and publish</button><button type="button" id="art-cancel" hidden>Cancel edit</button><p id="art-status" role="status"></p></form><label>Search artworks<input id="search-art" type="search"></label><label>Category filter<select id="filter-art"><option value="">All categories</option></select></label><div id="list"></div></section><section><h2>Brand Settings</h2><form id="brand"><label>Logo<input name="logo" type="file" accept="image/jpeg,image/png,image/webp"></label><label>Banner<input name="banner" type="file" accept="image/jpeg,image/png,image/webp"></label><button>Save brand images</button></form></section></div></main></body></html>
