<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Element Duel | Waifu Lab</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:radial-gradient(ellipse at top,#32134d,transparent 60%),#0c0814;color:#fff5ff;font:16px system-ui,sans-serif;padding:20px}main{width:min(100%,640px);padding:clamp(16px,5vw,38px);border:1px solid #674586;border-radius:24px;background:#191024;box-shadow:0 18px 70px #08040d;text-align:center}header small{color:#ef9df5;letter-spacing:.22em;text-transform:uppercase}h1{font-size:clamp(2.3rem,8vw,4.2rem);line-height:1;margin:10px 0;background:linear-gradient(105deg,#eee0ff,#ffa5e1);background-clip:text;color:transparent}.muted{color:#d2bddf}.arena,.cards{display:grid;gap:10px}.arena{grid-template-columns:1fr 1fr;margin:22px 0 12px}.slot{background:#251832;border-radius:14px;padding:13px 5px}.slot strong{font-size:1.45rem}.choice{min-height:55px;display:grid;place-items:center;font-size:1.25rem}.reveal{animation:flip .32s ease-out}@keyframes flip{from{transform:scale(.75) rotateX(65deg);opacity:.15}}.cards{grid-template-columns:repeat(4,1fr)}button{font:inherit;color:inherit;cursor:pointer;border:1px solid #795c96;border-radius:12px;background:#322147;padding:12px 4px;min-height:46px}button:hover:enabled{background:#523467}button:focus-visible{outline:3px solid #ffc8f7;outline-offset:3px}button:disabled{opacity:.5;cursor:default}.cards span{display:block;font-size:1.6rem}#message{min-height:3em;display:grid;place-items:center;margin:10px 0;color:#ffe0fa;font-weight:650}#again{margin-top:12px;padding:8px 25px}details{margin-top:17px;color:#d2bddf}summary{cursor:pointer}@media(max-width:340px){.cards{grid-template-columns:repeat(2,1fr)}}@media(prefers-reduced-motion:reduce){.reveal{animation:none}}
</style></head><body><main>
<header><p><a href="../" style="color:#efb9f4">← All games</a></p><small>Waifu Lab</small><h1>Element Duel</h1><p class="muted">Pick an element. First to 3 wins.</p></header>
<section class="arena" aria-label="Scoreboard">
<div class="slot"><div>You</div><strong id="playerScore">0</strong><div class="choice" id="playerChoice">—</div></div>
<div class="slot"><div>Computer</div><strong id="cpuScore">0</strong><div class="choice" id="cpuChoice">—</div></div>
</section>
<p id="message" role="status">Choose your first card.</p>
<div class="cards" aria-label="Element cards">
<button data-element="Fire"><span aria-hidden="true">🔥</span>Fire</button>
<button data-element="Water"><span aria-hidden="true">💧</span>Water</button>
<button data-element="Earth"><span aria-hidden="true">🪨</span>Earth</button>
<button data-element="Air"><span aria-hidden="true">🌬️</span>Air</button>
</div>
<button id="again" hidden>Play Again</button>
<details><summary>How to play</summary><p>Water beats Fire. Fire beats Air. Air beats Earth. Earth beats Water. Every other matchup is a draw.</p></details>
</main><script>
const winsAgainst = {Water:'Fire', Fire:'Air', Air:'Earth', Earth:'Water'};
const elements = Object.keys(winsAgainst);
const cards = [...document.querySelectorAll('[data-element]')];
const playerChoice = document.querySelector('#playerChoice');
const cpuChoice = document.querySelector('#cpuChoice');
const playerScore = document.querySelector('#playerScore');
const cpuScore = document.querySelector('#cpuScore');
const message = document.querySelector('#message');
const again = document.querySelector('#again');
let player = 0;
let cpu = 0;

function playRound(pick) {
  if (player === 3 || cpu === 3) return;
  const opponent = elements[Math.floor(Math.random() * elements.length)];
  playerChoice.textContent = pick;
  cpuChoice.textContent = opponent;
  for (const choice of [playerChoice, cpuChoice]) {
    choice.classList.remove('reveal');
    void choice.offsetWidth;
    choice.classList.add('reveal');
  }
  let result = 'Draw.';
  if (winsAgainst[pick] === opponent) {
    player++;
    result = 'You win the round.';
  } else if (winsAgainst[opponent] === pick) {
    cpu++;
    result = 'Computer wins the round.';
  }
  playerScore.textContent = player;
  cpuScore.textContent = cpu;
  const finished = player === 3 || cpu === 3;
  if (finished) result = player === 3 ? 'You win the match!' : 'Computer wins the match.';
  message.textContent = pick + ' vs ' + opponent + '. ' + result;
  if (finished) {
    for (const card of cards) card.disabled = true;
    again.hidden = false;
    again.focus();
  }
}

for (const card of cards) card.addEventListener('click', () => playRound(card.dataset.element));
again.addEventListener('click', () => {
  player = cpu = 0;
  playerScore.textContent = cpuScore.textContent = '0';
  playerChoice.textContent = cpuChoice.textContent = '—';
  message.textContent = 'Choose your first card.';
  for (const card of cards) card.disabled = false;
  again.hidden = true;
  cards[0].focus();
});
</script></body></html>
